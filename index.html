const ORDER=[["English",20],["Mathematics",20],["Chemistry",15],["Physics",15]],MINS=45;
let qs,ans,cur,end,tm,sub=0;
const $=s=>document.querySelector(s),app=$("#app"),L="ABCDE";
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function home(){clearInterval(tm);$("#timer").hidden=true;
app.innerHTML=`<div class="card"><h2>Practice Test</h2><p class="mut">${ORDER.map(([s,n])=>s+": "+Math.min(n,Q[s].length)).join(" • ")}<br>Time: ${MINS} minutes. Questions are drawn at random each attempt.</p><input id="nm" placeholder="Candidate name (optional)"><p><button class="btn" onclick="start()">Start Test</button></p></div>`}
function start(){const nm=$("#nm")?$("#nm").value:"";window.cand=nm;qs=[];
ORDER.forEach(([s,n])=>sh(Q[s]).slice(0,n).forEach(([q,o,a])=>{const idx=sh(o.map((_,i)=>i));qs.push({s,q,o:idx.map(i=>o[i]),a:idx.indexOf(a)})}));
ans=qs.map(()=>-1);cur=0;end=Date.now()+MINS*6e4;$("#timer").hidden=false;tick();tm=setInterval(tick,500);draw()}
function tick(){const r=Math.max(0,end-Date.now()),m=Math.floor(r/6e4),s=Math.floor(r%6e4/1e3),t=$("#timer");t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");t.className=r<5*6e4?"low":"";if(r<=0)finish()}
function draw(){const q=qs[cur],subs=[...new Set(qs.map(x=>x.s))];
app.innerHTML=`<div class="tabs">${subs.map(s=>`<button class="${s==q.s?"on":""}" onclick="cur=qs.findIndex(x=>x.s=='${s}');draw()">${s}</button>`).join("")}</div>
<div class="card"><p class="mut">${q.s} — Question ${cur+1} of ${qs.length}</p><p class="q">${q.q}</p>${q.o.map((o,i)=>`<button class="opt ${ans[cur]==i?"sel":""}" onclick="ans[cur]=${i};draw()">${L[i]}. ${o}</button>`).join("")}</div>
<div class="nav"><button class="btn g" ${cur?"":"disabled"} onclick="cur--;draw()">◀ Previous</button><button class="btn g" ${cur<qs.length-1?"":"disabled"} onclick="cur++;draw()">Next ▶</button></div>
<div class="card"><div class="pal">${qs.map((_,i)=>`<button class="${ans[i]>=0?"an":""} ${i==cur?"cu":""}" onclick="cur=${i};draw()">${i+1}</button>`).join("")}</div><p class="mut">${ans.filter(x=>x>=0).length} of ${qs.length} answered</p><button class="btn r" onclick="if(confirm('Submit test now?'))finish()">Submit</button></div>`;scrollTo(0,0)}
function finish(){clearInterval(tm);$("#timer").hidden=true;const by={};let tot=0;
qs.forEach((q,i)=>{by[q.s]=by[q.s]||[0,0];by[q.s][1]++;if(ans[i]==q.a){by[q.s][0]++;tot++}});
const pc=Math.round(tot/qs.length*100);
app.innerHTML=`<div class="card"><p class="mut">${window.cand||"Candidate"}</p><div class="big">${tot} / ${qs.length} (${pc}%)</div>${Object.entries(by).map(([s,[a,b]])=>`<p>${s}: <b>${a}/${b}</b></p>`).join("")}<button class="btn" onclick="home()">Take another test</button></div><h3>Corrections</h3>`+
qs.map((q,i)=>`<div class="card"><p class="mut">${i+1}. ${q.s} — ${ans[i]==q.a?"✓ Correct":ans[i]<0?"✗ Not answered":"✗ Wrong"}</p><p class="q">${q.q}</p>${q.o.map((o,j)=>`<div class="opt ${j==q.a?"ok":j==ans[i]?"bad":""}">${L[j]}. ${o}${j==q.a?" ✓":j==ans[i]?" (your answer)":""}</div>`).join("")}</div>`).join("")+`<button class="btn" onclick="home()">Take another test</button>`;scrollTo(0,0)}
home();
</script></body></html>
